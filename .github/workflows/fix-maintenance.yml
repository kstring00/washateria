name: One-time maintenance fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-maintenance.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean up CSS alignment warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/globals.css')
          s = p.read_text()
          replacements = {
              'align-items: end;': 'align-items: flex-end;',
              'align-items: start;': 'align-items: flex-start;',
              'justify-content: end;': 'justify-content: flex-end;',
              'justify-content: start;': 'justify-content: flex-start;',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Generate dependency lockfile
        run: npm install --package-lock-only
      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-maintenance.yml
      - name: Commit maintenance fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css package-lock.json
          git commit -m 'Clean build warnings and lock dependencies'
          git push
